<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Enterprise AI Assistant — Architecture</text>

  <!-- Client -->
  <g>
    <rect x="40" y="70" width="260" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="170" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Client</text>
    <text x="170" y="122" text-anchor="middle" font-size="12" fill="#1f2937">Streamlit UI</text>
    <text x="170" y="138" text-anchor="middle" font-size="11" fill="#4b5563">chat + agent activity panel</text>
  </g>

  <!-- FastAPI Backend -->
  <g>
    <rect x="40" y="190" width="260" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="170" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">FastAPI Backend</text>
    <rect x="60" y="224" width="220" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/>
    <text x="170" y="245" text-anchor="middle" font-size="11" fill="#1f2937">/auth/login (JWT issuance)</text>
    <rect x="60" y="264" width="220" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/>
    <text x="170" y="285" text-anchor="middle" font-size="11" fill="#1f2937">/chat/stream (SSE)</text>
    <rect x="60" y="304" width="220" height="26" rx="6" fill="#fef9c3" stroke="#eab308"/>
    <text x="170" y="321" text-anchor="middle" font-size="11" fill="#713f12">Token Bucket Rate Limiter</text>
  </g>

  <!-- LangGraph Orchestration -->
  <g>
    <rect x="380" y="70" width="640" height="150" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="700" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">LangGraph Orchestration</text>
    <g>
      <rect x="400" y="104" width="140" height="96" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="470" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Supervisor</text>
      <text x="470" y="144" text-anchor="middle" font-size="9.5" fill="#374151">intent + routing</text>
      <text x="470" y="158" text-anchor="middle" font-size="9.5" fill="#374151">+ injection screen</text>
    </g>
    <g>
      <rect x="556" y="104" width="140" height="96" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="626" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Retrieval Agent</text>
      <text x="626" y="144" text-anchor="middle" font-size="9.5" fill="#374151">hybrid RAG</text>
    </g>
    <g>
      <rect x="712" y="104" width="140" height="96" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="782" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Research Agent</text>
      <text x="782" y="144" text-anchor="middle" font-size="9.5" fill="#374151">RLM: plan / batch /</text>
      <text x="782" y="158" text-anchor="middle" font-size="9.5" fill="#374151">recurse / aggregate</text>
    </g>
    <g>
      <rect x="868" y="104" width="140" height="96" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="938" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Response Agent</text>
      <text x="938" y="144" text-anchor="middle" font-size="9.5" fill="#374151">answer + citations</text>
      <text x="938" y="158" text-anchor="middle" font-size="9.5" fill="#374151">+ output guardrails</text>
    </g>
    <path d="M540,152 H556" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <path d="M696,152 H712" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <path d="M852,152 H868" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  </g>

  <!-- Retrieval Stack -->
  <g>
    <rect x="380" y="250" width="420" height="150" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="590" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Retrieval Stack</text>
    <rect x="400" y="284" width="120" height="46" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="460" y="304" text-anchor="middle" font-size="10.5" fill="#1f2937">Dense Search</text>
    <text x="460" y="318" text-anchor="middle" font-size="9" fill="#6b7280">(embeddings)</text>
    <rect x="536" y="284" width="120" height="46" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="596" y="304" text-anchor="middle" font-size="10.5" fill="#1f2937">Sparse Search</text>
    <text x="596" y="318" text-anchor="middle" font-size="9" fill="#6b7280">(BM25)</text>
    <rect x="400" y="342" width="256" height="40" rx="6" fill="#ffedd5" stroke="#f97316"/>
    <text x="528" y="366" text-anchor="middle" font-size="10.5" fill="#7c2d12">Hybrid Ranking (weighted fusion)</text>
    <rect x="672" y="284" width="108" height="98" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="726" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">Pinecone</text>
    <text x="726" y="322" text-anchor="middle" font-size="9" fill="#6b7280">namespaces +</text>
    <text x="726" y="335" text-anchor="middle" font-size="9" fill="#6b7280">metadata filter</text>
    <text x="726" y="356" text-anchor="middle" font-size="9" fill="#9ca3af">— or local —</text>
    <text x="726" y="370" text-anchor="middle" font-size="9" fill="#6b7280">fallback store</text>
  </g>

  <!-- Tools -->
  <g>
    <rect x="850" y="250" width="230" height="150" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="965" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">Tools</text>
    <rect x="866" y="284" width="198" height="30" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="965" y="303" text-anchor="middle" font-size="10.5" fill="#1f2937">Knowledge Search Tool</text>
    <rect x="866" y="320" width="198" height="30" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="965" y="339" text-anchor="middle" font-size="10.5" fill="#1f2937">Python Analysis Tool</text>
    <rect x="866" y="356" width="198" height="30" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
    <text x="965" y="375" text-anchor="middle" font-size="10.5" fill="#1f2937">MCP Client</text>
  </g>

  <!-- External -->
  <g>
    <rect x="1120" y="250" width="240" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="1240" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">External</text>
    <rect x="1136" y="284" width="208" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1240" y="303" text-anchor="middle" font-size="10.5" fill="#1f2937">Dummy MCP Server</text>
    <rect x="1136" y="320" width="208" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1240" y="339" text-anchor="middle" font-size="10.5" fill="#1f2937">Anthropic / OpenAI / Groq / Offline stub</text>
    <rect x="1136" y="356" width="208" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1240" y="375" text-anchor="middle" font-size="10.5" fill="#1f2937">LangSmith (tracing)</text>
  </g>

  <!-- Cross-cutting -->
  <g>
    <rect x="40" y="440" width="1320" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="700" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Cross-cutting: Security &amp; Reliability</text>
    <rect x="70" y="476" width="300" height="66" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="220" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">RBAC enforcement</text>
    <text x="220" y="514" text-anchor="middle" font-size="10" fill="#4b5563">at the tool-call boundary,</text>
    <text x="220" y="528" text-anchor="middle" font-size="10" fill="#4b5563">not just the API route</text>
    <rect x="400" y="476" width="300" height="66" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="550" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Prompt injection +</text>
    <text x="550" y="514" text-anchor="middle" font-size="10" fill="#4b5563">output guardrails</text>
    <text x="550" y="528" text-anchor="middle" font-size="10" fill="#4b5563">(heuristic + LLM classifier)</text>
    <rect x="730" y="476" width="300" height="66" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="880" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Conversation Memory</text>
    <text x="880" y="514" text-anchor="middle" font-size="10" fill="#4b5563">short-term buffer +</text>
    <text x="880" y="528" text-anchor="middle" font-size="10" fill="#4b5563">running summarization</text>
    <rect x="1060" y="476" width="270" height="66" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="1195" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Resilient Fallbacks</text>
    <text x="1195" y="514" text-anchor="middle" font-size="10" fill="#4b5563">vector DB / embeddings / LLM</text>
    <text x="1195" y="528" text-anchor="middle" font-size="10" fill="#4b5563">degrade instead of erroring</text>
  </g>

  <!-- Flow arrows -->
  <path d="M170,150 V190" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="182" y="172" font-size="9.5" fill="#4b5563">login / POST message</text>

  <path d="M300,270 H380 V145" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="308" y="264" font-size="9.5" fill="#4b5563">rate-limited request</text>

  <path d="M626,200 V250" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M800,330 H850" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M1080,330 H1120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M938,200 V250 H900" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M700,400 V440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <path d="M965,400 V440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <path d="M170,150 V440 H70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Legend -->
  <g>
    <rect x="40" y="590" width="1320" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="60" y="614" font-size="11" fill="#374151">Solid arrows = primary request/data flow. Dashed = cross-cutting concerns applied throughout (auth, guardrails, memory, resilience).</text>
    <text x="60" y="634" font-size="11" fill="#374151">Every LangGraph node emits a state snapshot over SSE, which the Streamlit Agent Activity Panel renders live (node, tool calls, retrieval status, validation results).</text>
    <text x="60" y="650" font-size="10" fill="#6b7280">See docs/ARCHITECTURE.md for the full component list, RLM design, and memory design rationale.</text>
  </g>
</svg>
